<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Flappy Bird Pro 🐦</title>
    <style>
        :root {
            --bg: #4ec0ca; --text: #fff; --accent: #e94560;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #2c3e50; color: var(--text); display: flex; flex-direction: column; align-items: center; margin: 0; padding-top: 20px; overflow: hidden; user-select: none; }
        
        /* Zwiększony z-index do 2000, aby przycisk był zawsze na samym wierzchu */
        .back-btn { position: absolute; top: 20px; left: 20px; background: var(--accent); color: white; text-decoration: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; z-index: 2000; transition: 0.2s;}
        .back-btn:hover { background: #c0392b; }

        .stats { font-size: 2rem; font-weight: bold; margin-bottom: 10px; text-shadow: 2px 2px #000; }
        
        canvas { background: var(--bg); border: 4px solid #fff; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: block; }

        .instructions { font-size: 1.1rem; color: #bdc3c7; margin-top: 15px; text-align: center; }

        /* Wspólne style dla okienek (Modal) */
        .overlay-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .modal-content { background: #fff; color: #333; padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .modal-content h1 { font-size: 3rem; margin: 0; color: #e67e22; }
        .modal-content p { font-size: 1.5rem; margin: 10px 0; }
        
        /* Stylizacja przycisków wewnątrz okienek */
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 25px; flex-wrap: wrap; }
        .modal-content button { padding: 15px 30px; font-size: 1.2rem; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .modal-content button:hover { transform: scale(1.05); background: #27ae60;}
        
        /* Dodatkowy styl dla przycisku wyjścia */
        .modal-content button.btn-menu { background: #95a5a6; }
        .modal-content button.btn-menu:hover { background: #7f8c8d; }

        #start-modal { display: flex; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">⬅ Menu</a>
    
    <div class="stats">Wynik: <span id="score">0</span></div>
    <canvas id="flappyCanvas" width="400" height="600"></canvas>
    <div class="instructions">Naciśnij <b>SPACJĘ</b> lub <b>KLIKNIJ</b>, aby lecieć do góry!</div>

    <div id="start-modal" class="overlay-modal">
        <div class="modal-content">
            <h1>Flappy Bird</h1>
            <p style="font-size: 1.2rem; color: #7f8c8d;">Przygotuj się do lotu!</p>
            <div class="btn-group">
                <button onclick="startGame()">START</button>
                <button class="btn-menu" onclick="window.location.href='index.html'">Wróć do Menu</button>
            </div>
        </div>
    </div>

    <div id="game-over-modal" class="overlay-modal">
        <div class="modal-content">
            <h1>Koniec Lotu!</h1>
            <p>Wynik: <span id="finalScore">0</span></p>
            <p>Najlepszy: <span id="bestScore">0</span></p>
            <div class="btn-group">
                <button onclick="resetGame()">Spróbuj ponownie</button>
                <button class="btn-menu" onclick="window.location.href='index.html'">Wróć do Menu</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("flappyCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const gameOverModal = document.getElementById("game-over-modal");
        const startModal = document.getElementById("start-modal");

        let bird = { x: 50, y: 300, w: 34, h: 24, velocity: 0, gravity: 0.25, jump: -4.6, rotation: 0 };
        let pipes = [];
        let frame = 0;
        let score = 0;
        let bestScore = localStorage.getItem("flappyBest") || 0;
        
        let gameState = 'START'; 

        function createPipe() {
            let gap = 120;
            let minHeight = 50;
            let maxHeight = canvas.height - gap - minHeight - 50;
            let height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
            pipes.push({ x: canvas.width, y: 0, w: 50, h: height, type: 'top' });
            pipes.push({ x: canvas.width, y: height + gap, w: 50, h: canvas.height - height - gap, type: 'bottom' });
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.w/2, bird.y + bird.h/2);
            
            if (gameState === 'PLAYING') {
                bird.rotation = Math.min(Math.PI/4, Math.max(-Math.PI/4, bird.velocity * 0.1));
            } else {
                bird.rotation = 0; 
            }
            ctx.rotate(bird.rotation);
            
            // Korpus ptaszka
            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(-bird.w/2, -bird.h/2, bird.w, bird.h);
            // Oko
            ctx.fillStyle = "#fff";
            ctx.fillRect(5, -8, 8, 8);
            ctx.fillStyle = "#000";
            ctx.fillRect(10, -6, 3, 3);
            // Dziób
            ctx.fillStyle = "#e67e22";
            ctx.fillRect(12, 0, 10, 8);
            
            ctx.restore();
        }

        function drawPipes() {
            ctx.fillStyle = "#2ecc71";
            ctx.strokeStyle = "#27ae60";
            ctx.lineWidth = 3;
            pipes.forEach(p => {
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (bird.y + bird.h > canvas.height || bird.y < 0) endGame();

            if (frame % 100 === 0) createPipe();
            
            pipes.forEach((p, index) => {
                p.x -= 2;

                if (bird.x < p.x + p.w && bird.x + bird.w > p.x &&
                    bird.y < p.y + p.h && bird.y + bird.h > p.y) {
                    endGame();
                }

                if (p.type === 'top' && p.x + p.w === bird.x) {
                    score++;
                    scoreEl.innerText = score;
                }

                if (p.x + p.w < 0) pipes.splice(index, 1);
            });

            frame++;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPipes();
            drawBird();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function startGame() {
            startModal.style.display = "none";
            gameState = 'PLAYING';
            bird.velocity = bird.jump; 
        }

        function jump() {
            if (gameState === 'PLAYING') {
                bird.velocity = bird.jump;
            }
        }

        function endGame() {
            gameState = 'GAMEOVER';
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem("flappyBest", bestScore);
            }
            document.getElementById("finalScore").innerText = score;
            document.getElementById("bestScore").innerText = bestScore;
            gameOverModal.style.display = "flex";
        }

        function resetGame() {
            bird = { x: 50, y: 300, w: 34, h: 24, velocity: 0, gravity: 0.25, jump: -4.6, rotation: 0 };
            pipes = [];
            score = 0;
            frame = 0;
            scoreEl.innerText = score;
            gameOverModal.style.display = "none";
            gameState = 'PLAYING';
            bird.velocity = bird.jump;
        }

        window.addEventListener("keydown", (e) => { 
            if (e.code === "Space") {
                if (gameState === 'START') startGame(); 
                else jump();
            } 
        });
        canvas.addEventListener("mousedown", jump);

        loop();
    </script>
</body>
</html>
