<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Simon Says 🎨</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding-top: 40px; user-select: none; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #e74c3c; color: white; text-decoration: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; }
        
        h1 { margin: 0 0 10px 0; color: #f8fafc; font-size: 3rem; }
        #level-text { font-size: 1.5rem; color: #94a3b8; margin-bottom: 30px; }

        .simon-board { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #1e293b; padding: 20px; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 300px; height: 300px; }
        .pad { width: 100%; height: 100%; cursor: pointer; transition: 0.1s; opacity: 0.6; }
        
        #pad-0 { background: #ef4444; border-top-left-radius: 100%; } /* Czerwony */
        #pad-1 { background: #22c55e; border-top-right-radius: 100%; } /* Zielony */
        #pad-2 { background: #facc15; border-bottom-left-radius: 100%; } /* Żółty */
        #pad-3 { background: #3b82f6; border-bottom-right-radius: 100%; } /* Niebieski */

        .pad.active { opacity: 1; box-shadow: inset 0 0 20px rgba(255,255,255,0.8); filter: brightness(1.5); }
        
        .start-btn { margin-top: 40px; padding: 15px 40px; font-size: 1.5rem; background: #8b5cf6; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(139, 92, 246, 0.4); transition: 0.2s;}
        .start-btn:hover { background: #7c3aed; transform: scale(1.05); }

        /* Ekran Końcowy */
        #game-over-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; padding: 40px; border-radius: 15px; text-align: center; border: 4px solid #ef4444; }
        .modal-content h1 { font-size: 3rem; color: #ef4444; margin: 0 0 10px 0; }
        .modal-content button { padding: 15px 30px; font-size: 1.2rem; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">⬅ Menu</a>
    <h1>Simon Says</h1>
    <div id="level-text">Naciśnij Start, aby zagrać</div>

    <div class="simon-board">
        <div class="pad" id="pad-0" onclick="handlePadClick(0)"></div>
        <div class="pad" id="pad-1" onclick="handlePadClick(1)"></div>
        <div class="pad" id="pad-2" onclick="handlePadClick(2)"></div>
        <div class="pad" id="pad-3" onclick="handlePadClick(3)"></div>
    </div>

    <button class="start-btn" id="start-btn" onclick="startGame()">START</button>

    <div id="game-over-modal">
        <div class="modal-content">
            <h1>Pomyłka! 💥</h1>
            <h2 style="color: #f8fafc;">Dotarłeś do poziomu: <span id="final-score">0</span></h2>
            <button onclick="location.reload()">Zagraj ponownie</button>
        </div>
    </div>

    <script>
        let sequence = [];
        let playerSequence = [];
        let level = 0;
        let isPlayerTurn = false;
        
        // Dźwięki dla przycisków
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        const frequencies = [329.6, 261.6, 220.0, 164.8]; // Dźwięki E4, C4, A3, E3

        function playSound(index) {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(frequencies[index], audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function flashPad(index) {
            const pad = document.getElementById(`pad-${index}`);
            pad.classList.add('active');
            playSound(index);
            setTimeout(() => pad.classList.remove('active'), 300);
        }

        function nextLevel() {
            level++;
            playerSequence = [];
            isPlayerTurn = false;
            document.getElementById('level-text').innerText = `Poziom ${level}`;
            
            sequence.push(Math.floor(Math.random() * 4));
            
            let delay = 800;
            sequence.forEach((padIndex, i) => {
                setTimeout(() => {
                    flashPad(padIndex);
                }, delay * (i + 1));
            });

            setTimeout(() => {
                isPlayerTurn = true;
                document.getElementById('level-text').innerText = "Twój ruch!";
            }, delay * sequence.length + 500);
        }

        function handlePadClick(index) {
            if (!isPlayerTurn) return;
            
            flashPad(index);
            playerSequence.push(index);
            
            const currentMove = playerSequence.length - 1;
            
            if (playerSequence[currentMove] !== sequence[currentMove]) {
                gameOver();
                return;
            }
            
            if (playerSequence.length === sequence.length) {
                isPlayerTurn = false;
                document.getElementById('level-text').innerText = "Świetnie! Zapamiętaj kolejne...";
                setTimeout(nextLevel, 1000);
            }
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('start-btn').style.display = 'none';
            sequence = [];
            level = 0;
            nextLevel();
        }

        function gameOver() {
            isPlayerTurn = false;
            document.getElementById('final-score').innerText = level;
            document.getElementById('game-over-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
