<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wisielec Pro 🔤</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --accent: #3b82f6; --danger: #ef4444; --success: #22c55e; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; margin: 0; padding-top: 30px; user-select: none; overflow-x: hidden; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: var(--danger); color: white; text-decoration: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; transition: 0.2s;}
        .back-btn:hover { background: #dc2626; }
        
        h1 { margin: 0 0 5px 0; font-size: 3rem; color: var(--accent); }
        .category-label { font-size: 1.5rem; color: #94a3b8; margin-bottom: 25px; font-weight: bold; background: rgba(0,0,0,0.3); padding: 10px 25px; border-radius: 10px; border: 1px solid #334155; }
        .category-highlight { color: #facc15; }

        .game-container { display: flex; gap: 40px; background: var(--panel); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); align-items: center; width: 90%; max-width: 1000px; justify-content: center;}
        
        /* Szubienica SVG */
        #hangman-drawing { width: 200px; height: 250px; stroke: #94a3b8; stroke-width: 4; fill: transparent; stroke-linecap: round; flex-shrink: 0; }
        .part { opacity: 0; transition: opacity 0.3s; }
        .part.visible { opacity: 1; }

        .word-section { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0; }
        
        /* ZMIANA TUTAJ: Wymuszenie 1 linijki i skalowanie czcionki */
        #word-display { 
            font-size: clamp(1.2rem, 3vw, 2.5rem); /* Zmniejsza się automatycznie, gdy brak miejsca */
            font-weight: bold; 
            letter-spacing: 6px; 
            margin-bottom: 30px; 
            text-transform: uppercase; 
            text-align: center; 
            white-space: nowrap; /* Wymusza jedną linię! */
        }
        
        .keyboard { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 550px; }
        .key { padding: 12px 18px; font-size: 1.2rem; font-weight: bold; background: #334155; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .key:hover:not(:disabled) { background: #475569; transform: translateY(-2px); }
        .key:disabled { opacity: 0.5; cursor: default; transform: none; }
        .key.correct { background: var(--success); color: #000; }
        .key.wrong { background: var(--danger); color: #fff; }

        /* Ekran Końcowy */
        #game-over-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .modal-content { background: var(--panel); padding: 40px; border-radius: 15px; text-align: center; border: 4px solid var(--accent); }
        .modal-content h1 { font-size: 3.5rem; margin: 0 0 10px 0; }
        .modal-content button { padding: 15px 30px; font-size: 1.2rem; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 20px;}
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">⬅ Menu</a>

            // Rośliny
            { word: "DĄB BARTEK", category: "Rośliny" }, { word: "SOSNA", category: "Rośliny" },

            { word: "PAPROĆ", category: "Rośliny" }, { word: "MUCHOMOR", category: "Rośliny" },
            { word: "ORCHIDEA", category: "Rośliny" }, { word: "KLON", category: "Rośliny" },
            { word: "STOKROTKA", category: "Rośliny" }, { word: "MLECZ", category: "Rośliny" }
        ];

        let chosenData = dictionary[Math.floor(Math.random() * dictionary.length)];
        let chosenWord = chosenData.word;
        
        let guessedLetters = [];
        let mistakes = 0;
        const maxMistakes = 10;
        let isGameOver = false;

        const wordDisplay = document.getElementById('word-display');
        const categoryDisplay = document.getElementById('category-display');
        const keyboard = document.getElementById('keyboard');
        const modal = document.getElementById('game-over-modal');

        function initGame() {
            categoryDisplay.innerText = chosenData.category;
            initKeyboard();
            updateWordDisplay();
        }

        function initKeyboard() {
            const letters = "AĄBCĆDEĘFGHIJKLŁMNŃOÓPQRSŚTUVWXYZŹŻ";
            letters.split('').forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'key';
                btn.id = `key-${letter}`; 
                btn.innerText = letter;
                btn.onclick = () => handleGuess(letter, btn);
                keyboard.appendChild(btn);
            });
        }

        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            
            const key = e.key.toUpperCase();
            const validLetters = "AĄBCĆDEĘFGHIJKLŁMNŃOÓPQRSŚTUVWXYZŹŻ";
            
            if (validLetters.includes(key)) {
                const btn = document.getElementById(`key-${key}`);
                if (btn && !btn.disabled) {
                    handleGuess(key, btn);
                }
            }
        });

        function updateWordDisplay() {
            let display = chosenWord.split('').map(letter => {
                if (letter === " ") return "\u00A0\u00A0"; 
                return guessedLetters.includes(letter) ? letter : "_";
            }).join(' ');
            
            wordDisplay.innerText = display;

            if (!display.includes("_")) {
                endGame(true);
            }
        }

        function handleGuess(letter, btnEl) {
            if (btnEl.disabled || isGameOver) return;
            
            btnEl.disabled = true;
            guessedLetters.push(letter);

            if (chosenWord.includes(letter)) {
                btnEl.classList.add('correct');
                updateWordDisplay();
            } else {
                btnEl.classList.add('wrong');
                document.getElementById(`part-${mistakes}`).classList.add('visible');
                mistakes++;
                if (mistakes >= maxMistakes) {
                    endGame(false);
                }
            }
        }

        function endGame(isWin) {
            isGameOver = true;
            document.getElementById('end-title').innerText = isWin ? "Wygrałeś! 🎉" : "Przegrałeś! 💀";
            document.getElementById('end-title').style.color = isWin ? "var(--success)" : "var(--danger)";
            document.getElementById('correct-word').innerText = chosenWord;
            modal.style.display = 'flex';
        }

        initGame();
    </script>
</body>
</html>
