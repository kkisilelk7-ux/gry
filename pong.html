<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Pong Pro 🏓</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding-top: 20px; overflow: hidden; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #e74c3c; color: white; text-decoration: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; }
        h1 { color: #22c55e; margin: 10px 0; }
        canvas { background: #020617; border: 4px solid #fff; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); cursor: none; }
        .instructions { font-size: 1.2rem; color: #94a3b8; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">⬅ Menu</a>
    <h1>🏓 Pong Pro</h1>
    <canvas id="pongCanvas" width="800" height="500"></canvas>
    <div class="instructions">Steruj <b>MYSZKĄ</b> góra-dół, aby odbijać piłkę. Kto pierwszy zdobędzie 10 punktów?</div>
    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        const user = { x: 10, y: canvas.height/2 - 50, width: 10, height: 100, color: "#38bdf8", score: 0 };
        const ai = { x: canvas.width - 20, y: canvas.height/2 - 50, width: 10, height: 100, color: "#ef4444", score: 0 };
        const ball = { x: canvas.width/2, y: canvas.height/2, radius: 10, speed: 7, velocityX: 5, velocityY: 5, color: "#fff" };

        function drawRect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
        function drawArc(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2,false); ctx.closePath(); ctx.fill(); }
        function drawText(text, x, y, color) { ctx.fillStyle = color; ctx.font = "50px 'Segoe UI'"; ctx.fillText(text, x, y); }

        canvas.addEventListener("mousemove", (evt) => {
            let rect = canvas.getBoundingClientRect();
            user.y = evt.clientY - rect.top - user.height/2;
        });

        function resetBall() {
            ball.x = canvas.width/2; ball.y = canvas.height/2;
            ball.velocityX = -ball.velocityX;
            ball.speed = 7;
        }

        function update() {
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // AI (Proste śledzenie piłki)
            let computerLevel = 0.1;
            ai.y += (ball.y - (ai.y + ai.height/2)) * computerLevel;

            if(ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) ball.velocityY = -ball.velocityY;

            let player = (ball.x < canvas.width/2) ? user : ai;
            
            if(ball.x - ball.radius < player.x + player.width && ball.x + ball.radius > player.x && ball.y < player.y + player.height && ball.y > player.y) {
                let collidePoint = (ball.y - (player.y + player.height/2)) / (player.height/2);
                let angleRad = (Math.PI/4) * collidePoint;
                let direction = (ball.x < canvas.width/2) ? 1 : -1;
                
                ball.velocityX = direction * ball.speed * Math.cos(angleRad);
                ball.velocityY = ball.speed * Math.sin(angleRad);
                ball.speed += 0.5; // Przyspieszanie po odbiciu
            }

            if(ball.x - ball.radius < 0) { ai.score++; resetBall(); }
            else if(ball.x + ball.radius > canvas.width) { user.score++; resetBall(); }
        }

        function render() {
            drawRect(0, 0, canvas.width, canvas.height, "#020617");
            for(let i=0; i<=canvas.height; i+=40) drawRect(canvas.width/2 - 1, i, 2, 20, "rgba(255,255,255,0.2)");
            drawText(user.score, canvas.width/4, 70, "#38bdf8");
            drawText(ai.score, 3*canvas.width/4, 70, "#ef4444");
            drawRect(user.x, user.y, user.width, user.height, user.color);
            drawRect(ai.x, ai.y, ai.width, ai.height, ai.color);
            drawArc(ball.x, ball.y, ball.radius, ball.color);
        }

        function game() { update(); render(); requestAnimationFrame(game); }
        game();
    </script>
</body>
</html>
