<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Asteroids Pro ☄️</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding-top: 20px; overflow: hidden; user-select: none; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #e74c3c; color: white; text-decoration: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; z-index: 100;}
        h1 { margin: 0 0 10px 0; color: #eab308; text-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
        .score-bar { font-size: 1.5rem; color: #38bdf8; margin-bottom: 15px; font-weight: bold; }
        canvas { background: #020617; border: 2px solid #334155; border-radius: 8px; box-shadow: 0 0 40px rgba(234, 179, 8, 0.2); }
        .instructions { color: #94a3b8; margin-top: 15px; text-align: center; }
        
        .overlay-modal { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; padding: 40px; border-radius: 15px; text-align: center; border: 4px solid #eab308; box-shadow: 0 0 30px rgba(234, 179, 8, 0.3); }
        .modal-content h1 { font-size: 3rem; color: #eab308; margin-bottom: 10px; }
        .modal-content button { padding: 15px 40px; font-size: 1.5rem; background: #38bdf8; color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .modal-content button:hover { background: #0ea5e9; transform: scale(1.05); }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">⬅ Menu</a>
    <h1>☄️ Asteroidy Pro</h1>
    <div class="score-bar">Punkty: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="instructions"><b>Strzałki L/P</b>: Obrót | <b>Strzałka Góra</b>: Silnik | <b>SPACJA</b>: Strzał</div>

    <div id="start-modal" class="overlay-modal">
        <div class="modal-content">
            <h1>Asteroidy Pro</h1>
            <p>Powolny dryf. Celuj precyzyjnie!</p>
            <button onclick="startGame()">START</button>
        </div>
    </div>

    <div id="game-over-modal" class="overlay-modal" style="display:none;">
        <div class="modal-content" style="border-color: #ef4444;">
            <h1 style="color: #ef4444;">Koniec Misji! 💥</h1>
            <h2>Wynik: <span id="final-score">0</span></h2>
            <button onclick="location.reload()">Spróbuj ponownie</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        
        let score = 0;
        let gameState = 'START'; 
        let keys = {};

        const FPS = 60;
        const FRICTION = 0.7;
        const THRUST = 5;
        const TURN_SPEED = 180; 

        const ship = {
            x: canvas.width / 2, y: canvas.height / 2, r: 15,
            a: 90 / 180 * Math.PI,
            thrusting: false, thrust: { x: 0, y: 0 }
        };

        let asteroids = [];
        let lasers = [];

        function startGame() {
            document.getElementById('start-modal').style.display = 'none';
            createAsteroids();
            gameState = 'PLAYING';
        }

        function createAsteroids() {
            asteroids = [];
            for (let i = 0; i < 6; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * canvas.width);
                    y = Math.floor(Math.random() * canvas.height);
                } while (distBetweenPoints(ship.x, ship.y, x, y) < 150);
                asteroids.push(newAsteroid(x, y, 50));
            }
        }

        function newAsteroid(x, y, r) {
            // USTAWIENIE PRĘDKOŚCI: Bardzo małe wartości dla wolnego ruchu
            const speedScale = 0.5; 
            return {
                x: x, y: y,
                xv: (Math.random() * speedScale - speedScale/2), 
                yv: (Math.random() * speedScale - speedScale/2),
                r: r, a: Math.random() * Math.PI * 2,
                rot: (Math.random() * 0.02 - 0.01), // Wolny obrót samej skały
                vert: Math.floor(Math.random() * 6 + 6)
            };
        }

        function distBetweenPoints(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        }

        function shootLaser() {
            if (lasers.length < 10) {
                lasers.push({
                    x: ship.x + 4 / 3 * ship.r * Math.cos(ship.a),
                    y: ship.y - 4 / 3 * ship.r * Math.sin(ship.a),
                    xv: 500 * Math.cos(ship.a) / FPS,
                    yv: -500 * Math.sin(ship.a) / FPS,
                    dist: 0
                });
            }
        }

        document.addEventListener("keydown", e => {
            keys[e.code] = true;
            if(e.code === "Space" && gameState === 'PLAYING') shootLaser();
        });
        document.addEventListener("keyup", e => keys[e.code] = false);

        function update() {
            if (gameState !== 'PLAYING') return;

            if (keys["ArrowLeft"]) ship.a += TURN_SPEED / 180 * Math.PI / FPS;
            if (keys["ArrowRight"]) ship.a -= TURN_SPEED / 180 * Math.PI / FPS;
            
            ship.thrusting = keys["ArrowUp"];
            if (ship.thrusting) {
                ship.thrust.x += THRUST * Math.cos(ship.a) / FPS;
                ship.thrust.y -= THRUST * Math.sin(ship.a) / FPS;
            } else {
                ship.thrust.x -= FRICTION * ship.thrust.x / FPS;
                ship.thrust.y -= FRICTION * ship.thrust.y / FPS;
            }

            ship.x += ship.thrust.x;
            ship.y += ship.thrust.y;

            if (ship.x < 0 - ship.r) ship.x = canvas.width + ship.r;
            else if (ship.x > canvas.width + ship.r) ship.x = 0 - ship.r;
            if (ship.y < 0 - ship.r) ship.y = canvas.height + ship.r;
            else if (ship.y > canvas.height + ship.r) ship.y = 0 - ship.r;

            // Ruch asteroid
            for (let i = 0; i < asteroids.length; i++) {
                asteroids[i].x += asteroids[i].xv;
                asteroids[i].y += asteroids[i].yv;
                asteroids[i].a += asteroids[i].rot;

                if (asteroids[i].x < 0 - asteroids[i].r) asteroids[i].x = canvas.width + asteroids[i].r;
                else if (asteroids[i].x > canvas.width + asteroids[i].r) asteroids[i].x = 0 - asteroids[i].r;
                if (asteroids[i].y < 0 - asteroids[i].r) asteroids[i].y = canvas.height + asteroids[i].r;
                else if (asteroids[i].y > canvas.height + asteroids[i].r) asteroids[i].y = 0 - asteroids[i].r;
            }

            for (let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].x += lasers[i].xv;
                lasers[i].y += lasers[i].yv;
                lasers[i].dist += Math.sqrt(Math.pow(lasers[i].xv, 2) + Math.pow(lasers[i].yv, 2));

                if (lasers[i].x < 0 || lasers[i].x > canvas.width || lasers[i].y < 0 || lasers[i].y > canvas.height || lasers[i].dist > canvas.width * 0.8) {
                    lasers.splice(i, 1);
                    continue;
                }

                for (let j = asteroids.length - 1; j >= 0; j--) {
                    if (distBetweenPoints(asteroids[j].x, asteroids[j].y, lasers[i].x, lasers[i].y) < asteroids[j].r) {
                        let a = asteroids[j];
                        score += (a.r > 25) ? 20 : 50;
                        scoreEl.innerText = score;
                        if (a.r > 25) {
                            asteroids.push(newAsteroid(a.x, a.y, a.r / 2));
                            asteroids.push(newAsteroid(a.x, a.y, a.r / 2));
                        }
                        asteroids.splice(j, 1);
                        lasers.splice(i, 1);
                        if(asteroids.length === 0) createAsteroids();
                        break;
                    }
                }
            }

            for (let i = 0; i < asteroids.length; i++) {
                if (distBetweenPoints(ship.x, ship.y, asteroids[i].x, asteroids[i].y) < ship.r + asteroids[i].r) {
                    endGame();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (gameState === 'START') return;

            if (gameState === 'PLAYING') {
                ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.beginPath();
                ctx.moveTo(ship.x + 4 / 3 * ship.r * Math.cos(ship.a), ship.y - 4 / 3 * ship.r * Math.sin(ship.a));
                ctx.lineTo(ship.x - ship.r * (2 / 3 * Math.cos(ship.a) + Math.sin(ship.a)), ship.y + ship.r * (2 / 3 * Math.sin(ship.a) - Math.cos(ship.a)));
                ctx.lineTo(ship.x - ship.r * (2 / 3 * Math.cos(ship.a) - Math.sin(ship.a)), ship.y + ship.r * (2 / 3 * Math.sin(ship.a) + Math.cos(ship.a)));
                ctx.closePath(); ctx.stroke();
                if (ship.thrusting) {
                    ctx.fillStyle = "orange"; ctx.beginPath();
                    ctx.moveTo(ship.x - ship.r * (2 / 3 * Math.cos(ship.a) + 0.5 * Math.sin(ship.a)), ship.y + ship.r * (2 / 3 * Math.sin(ship.a) - 0.5 * Math.cos(ship.a)));
                    ctx.lineTo(ship.x - ship.r * 5 / 3 * Math.cos(ship.a), ship.y + ship.r * 5 / 3 * Math.sin(ship.a));
                    ctx.lineTo(ship.x - ship.r * (2 / 3 * Math.cos(ship.a) - 0.5 * Math.sin(ship.a)), ship.y + ship.r * (2 / 3 * Math.sin(ship.a) + 0.5 * Math.cos(ship.a)));
                    ctx.closePath(); ctx.fill();
                }
            }

            ctx.fillStyle = "yellow";
            lasers.forEach(l => { ctx.beginPath(); ctx.arc(l.x, l.y, 3, 0, Math.PI * 2, false); ctx.fill(); });

            ctx.strokeStyle = "slategray"; ctx.lineWidth = 2;
            asteroids.forEach(a => {
                ctx.beginPath();
                for (let j = 0; j < a.vert; j++) {
                    ctx.lineTo(a.x + a.r * Math.cos(a.a + j * Math.PI * 2 / a.vert), a.y + a.r * Math.sin(a.a + j * Math.PI * 2 / a.vert));
                }
                ctx.closePath(); ctx.stroke();
            });
        }

        function endGame() {
            gameState = 'GAMEOVER';
            document.getElementById("final-score").innerText = score;
            document.getElementById("game-over-modal").style.display = "flex";
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
