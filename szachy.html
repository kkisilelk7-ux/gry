<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Szachy Turniejowe Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #2c3e50; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding-top: 20px; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: #e74c3c; color: white; text-decoration: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; z-index: 100;}
        .game-wrapper { display: flex; gap: 30px; margin-top: 40px; align-items: flex-start; justify-content: center; width: 100%; max-width: 1000px; }
        .side-panel { background: #1a252f; padding: 15px; border-radius: 10px; width: 120px; min-height: 400px; border: 2px solid #5c4033; text-align: center; }
        .side-panel h3 { margin-top: 0; font-size: 1rem; color: #f1c40f; border-bottom: 1px solid #5c4033; padding-bottom: 10px; }
        .trophy-box { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; font-size: 35px; }
        .main-panel { display: flex; flex-direction: column; align-items: center; }
        .timers { display: flex; justify-content: space-between; width: 100%; font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
        .timer { background: #34495e; padding: 10px 20px; border-radius: 5px; border: 2px solid transparent; transition: 0.3s; }
        .timer.active { background: #27ae60; border-color: #2ecc71; transform: scale(1.05); }
        .timer.paused { background: #f39c12; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.7; } }
        #status { font-size: 1.2rem; margin-bottom: 10px; font-weight: bold; color: #f1c40f; min-height: 25px; }
        #board { display: grid; grid-template-columns: repeat(8, 60px); border: 4px solid #5c4033; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .cell { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; position: relative; }
        .bg-dark { background: #8b4513; }
        .bg-light { background: #deb887; }
        .selected { background-color: rgba(231, 76, 60, 0.4) !important; }
        .in-check { background-color: rgba(231, 76, 60, 0.8) !important; outline: 3px solid red; outline-offset: -3px; }
        /* Kropka podświetlająca ruch */
        .highlight::after { content: ''; width: 20px; height: 20px; background: rgba(46, 204, 113, 0.8); border-radius: 50%; position: absolute; z-index: 10; box-shadow: 0 0 5px rgba(0,0,0,0.5);}
        .highlight.capture::after { width: 50px; height: 50px; background: transparent; border: 4px solid rgba(231, 76, 60, 0.8); border-radius: 50%; }
        .piece { font-size: 45px; line-height: 1; pointer-events: none; z-index: 5; }
        .piece.black { color: #111 !important; text-shadow: 0 0 3px #fff; }
        .piece.white { color: #fff !important; text-shadow: 0 0 3px #000; }
        .controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .controls button { padding: 10px 15px; font-weight: bold; color: white; border: none; border-radius: 5px; cursor: pointer; background: #3498db; }
        .controls button.btn-danger { background: #e74c3c; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">⬅ Menu</a>
    <div class="game-wrapper">
        <div class="side-panel"><h3>Zdobycze Bota</h3><div id="bot-trophies" class="trophy-box"></div></div>
        <div class="main-panel">
            <div class="timers">
                <div id="bot-timer" class="timer">Bot: 08:00</div>
                <div id="player-timer" class="timer active">Ty: 08:00</div>
            </div>
            <div id="status">Twój ruch (Białe)</div>
            <div id="board"></div>
            <div class="controls">
                <button onclick="togglePause()" id="pause-btn">⏸ Zastopuj Zegar</button>
                <button onclick="undoMove()">↩ Cofnij Błąd</button>
                <button onclick="location.reload()" class="btn-danger">🏳 Poddaj się / Restart</button>
            </div>
        </div>
        <div class="side-panel"><h3>Twoje Zdobycze</h3><div id="player-trophies" class="trophy-box"></div></div>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        let boardState = []; let selectedCell = null; let playerTurn = true; let gameActive = true;
        let playerTrophies = []; let botTrophies = [];    
        let castlingRights = { white: { king: true, rookK: true, rookQ: true }, black: { king: true, rookK: true, rookQ: true } };
        let playerTime = 480; let botTime = 480; let timerInterval = null; let isPaused = false; let history = [];

        const initialSetup = [
            ['♜','♞','♝','♛','♚','♝','♞','♜'], ['♟','♟','♟','♟','♟','♟','♟','♟'],
            [null,null,null,null,null,null,null,null], [null,null,null,null,null,null,null,null],
            [null,null,null,null,null,null,null,null], [null,null,null,null,null,null,null,null],
            ['♙','♙','♙','♙','♙','♙','♙','♙'], ['♖','♘','♗','♕','♔','♗','♘','♖']
        ];

        function getTeam(icon) { return !icon ? null : ['♜','♞','♝','♛','♚','♟'].includes(icon) ? 'black' : 'white'; }
        function cloneBoard(board) { return board.map(row => [...row]); }

        function saveState() {
            history.push({ board: cloneBoard(boardState), pTrophies: [...playerTrophies], bTrophies: [...botTrophies], cRights: JSON.parse(JSON.stringify(castlingRights)) });
        }

        function undoMove() {
            if(history.length === 0 || !playerTurn || !gameActive || isPaused) return;
            let lastState = history.pop();
            boardState = cloneBoard(lastState.board); playerTrophies = [...lastState.pTrophies]; botTrophies = [...lastState.bTrophies];
            castlingRights = JSON.parse(JSON.stringify(lastState.cRights)); selectedCell = null;
            document.getElementById('status').innerText = "Cofnięto. Twój ruch."; renderBoard();
        }

        function startTimers() {
            timerInterval = setInterval(() => {
                if(isPaused || !gameActive) return;
                if(playerTurn) { playerTime--; if(playerTime<=0) { gameActive=false; alert("Czas minął! Przegrywasz."); } }
                else { botTime--; if(botTime<=0) { gameActive=false; alert("Czas Bota minął! Wygrywasz."); } }
                document.getElementById('player-timer').innerText = `Ty: ${Math.floor(playerTime/60).toString().padStart(2,'0')}:${(playerTime%60).toString().padStart(2,'0')}`;
                document.getElementById('bot-timer').innerText = `Bot: ${Math.floor(botTime/60).toString().padStart(2,'0')}:${(botTime%60).toString().padStart(2,'0')}`;
            }, 1000);
        }
        function togglePause() { isPaused = !isPaused; document.getElementById('pause-btn').innerText = isPaused ? "▶ Wznów" : "⏸ Zastopuj Zegar"; }

        function isPathClear(b, r1, c1, r2, c2) {
            let dr = Math.sign(r2-r1), dc = Math.sign(c2-c1), cr = r1+dr, cc = c1+dc;
            while(cr !== r2 || cc !== c2) { if(b[cr][cc] !== null) return false; cr += dr; cc += dc; }
            return true;
        }

        function isBasicMoveValid(b, icon, team, r1, c1, r2, c2) {
            let tgt = b[r2][c2]; if(getTeam(tgt) === team) return false; 
            let dr = r2-r1, dc = c2-c1, adr = Math.abs(dr), adc = Math.abs(dc);
            if(icon === '♙' || icon === '♟') {
                let dir = team === 'white' ? -1 : 1, startRow = team === 'white' ? 6 : 1;
                if(!tgt && dc === 0) { if(dr===dir) return true; if(r1===startRow && dr===2*dir && b[r1+dir][c1]===null) return true; }
                if(tgt && adc === 1 && dr === dir) return true;
                return false;
            }
            if(icon === '♖' || icon === '♜') return (dr===0 || dc===0) && isPathClear(b,r1,c1,r2,c2);
            if(icon === '♗' || icon === '♝') return adr===adc && isPathClear(b,r1,c1,r2,c2);
            if(icon === '♕' || icon === '♛') return (dr===0 || dc===0 || adr===adc) && isPathClear(b,r1,c1,r2,c2);
            if(icon === '♘' || icon === '♞') return (adr===2 && adc===1) || (adr===1 && adc===2);
            if(icon === '♔' || icon === '♚') {
                if(adr<=1 && adc<=1) return true;
                if(adr===0 && adc===2 && r1 === (team==='white'?7:0) && c1===4) {
                    if(c2===6) return isPathClear(b,r1,4,r1,7);
                    if(c2===2) return isPathClear(b,r1,4,r1,0) && b[r1][1]===null;
                }
            } return false;
        }

        function isKingInCheck(b, team) {
            let kr=-1, kc=-1, kIcon=team==='white'?'♔':'♚';
            for(let r=0; r<8; r++) for(let c=0; c<8; c++) if(b[r][c]===kIcon) { kr=r; kc=c; break; }
            let eTeam = team==='white'?'black':'white';
            for(let r=0; r<8; r++) for(let c=0; c<8; c++) if(getTeam(b[r][c])===eTeam && isBasicMoveValid(b, b[r][c], eTeam, r, c, kr, kc)) return true;
            return false;
        }

        function getLegalMoves(b, team) {
            let moves = [];
            for(let r1=0; r1<8; r1++) for(let c1=0; c1<8; c1++) {
                let p = b[r1][c1];
                if(getTeam(p) === team) {
                    for(let r2=0; r2<8; r2++) for(let c2=0; c2<8; c2++) {
                        if(isBasicMoveValid(b, p, team, r1, c1, r2, c2)) {
                            let isCastling = (p==='♔'||p==='♚') && Math.abs(c2-c1)===2;
                            if(isCastling) {
                                if(team==='white' && !castlingRights.white.king) continue;
                                if(team==='black' && !castlingRights.black.king) continue;
                                if(c2===6 && !castlingRights[team].rookK) continue;
                                if(c2===2 && !castlingRights[team].rookQ) continue;
                                if(isKingInCheck(b, team)) continue;
                                let tb = cloneBoard(b); tb[r1][c1+Math.sign(c2-c1)] = p; tb[r1][c1] = null;
                                if(isKingInCheck(tb, team)) continue;
                            }
                            let tb = cloneBoard(b); tb[r2][c2] = p; tb[r1][c1] = null;
                            if(isCastling) { if(c2===6){ tb[r1][5]=tb[r1][7]; tb[r1][7]=null;} if(c2===2){tb[r1][3]=tb[r1][0]; tb[r1][0]=null;} }
                            if(!isKingInCheck(tb, team)) moves.push({r1,c1,r2,c2,p,tgt:b[r2][c2],isCastling});
                        }
                    }
                }
            } return moves;
        }

        function renderBoard() {
            boardEl.innerHTML = ''; let wCheck = isKingInCheck(boardState, 'white'), bCheck = isKingInCheck(boardState, 'black');
            let legalMoves = (selectedCell && playerTurn) ? getLegalMoves(boardState, 'white').filter(m => m.r1===selectedCell.r && m.c1===selectedCell.c) : [];

            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    let cell = document.createElement('div');
                    cell.className = `cell ${(r+c)%2!==0 ? 'bg-dark' : 'bg-light'}`;
                    cell.dataset.r = r; cell.dataset.c = c;
                    
                    let icon = boardState[r][c];
                    if(icon) {
                        let span = document.createElement('span'); span.className = `piece ${getTeam(icon)}`; span.innerText = icon; cell.appendChild(span);
                        if((icon==='♔'&&wCheck) || (icon==='♚'&&bCheck)) cell.classList.add('in-check');
                    }
                    if(selectedCell && selectedCell.r===r && selectedCell.c===c) cell.classList.add('selected');
                    
                    // Podświetlanie ruchu
                    if(legalMoves.some(m => m.r2===r && m.c2===c)) {
                        cell.classList.add('highlight');
                        if(icon) cell.classList.add('capture'); // Czerwony okrąg na bicie
                    }

                    cell.onclick = () => handleCellClick(r, c);
                    boardEl.appendChild(cell);
                }
            }
            document.getElementById('player-trophies').innerHTML = playerTrophies.map(i=>`<span class="piece black">${i}</span>`).join('');
            document.getElementById('bot-trophies').innerHTML = botTrophies.map(i=>`<span class="piece white">${i}</span>`).join('');
        }

        for(let r=0; r<8; r++) { boardState[r] = []; for(let c=0; c<8; c++) boardState[r][c] = initialSetup[r][c]; }
        renderBoard(); startTimers();

        function executeMove(m) {
            saveState();
            if(m.tgt) { if(getTeam(m.p)==='white') playerTrophies.push(m.tgt); else botTrophies.push(m.tgt); }
            if(m.p==='♔') castlingRights.white.king=false; if(m.p==='♚') castlingRights.black.king=false;
            if(m.r1===7&&m.c1===0) castlingRights.white.rookQ=false; if(m.r1===7&&m.c1===7) castlingRights.white.rookK=false;
            boardState[m.r2][m.c2] = m.p; boardState[m.r1][m.c1] = null;
            if(m.isCastling) { if(m.c2===6){boardState[m.r1][5]=boardState[m.r1][7];boardState[m.r1][7]=null;} if(m.c2===2){boardState[m.r1][3]=boardState[m.r1][0];boardState[m.r1][0]=null;} }
            renderBoard();
        }

        function handleCellClick(r, c) {
            if(!playerTurn || !gameActive || isPaused) return;
            if(selectedCell) {
                if(getTeam(boardState[r][c]) === 'white') { selectedCell = {r,c}; renderBoard(); return; }
                let validMove = getLegalMoves(boardState, 'white').find(m => m.r1===selectedCell.r && m.c1===selectedCell.c && m.r2===r && m.c2===c);
                if(validMove) {
                    executeMove(validMove); selectedCell = null;
                    if(getLegalMoves(boardState, 'black').length === 0) { gameActive=false; alert(isKingInCheck(boardState, 'black')?"Szach-Mat! Wygrałeś!":"Pat. Remis."); return; }
                    playerTurn = false; document.getElementById('status').innerText = "Tura Bota..."; setTimeout(aiMove, 500);
                } else { selectedCell = null; renderBoard(); }
            } else { if(getTeam(boardState[r][c]) === 'white') { selectedCell = {r,c}; renderBoard(); } }
        }

        function aiMove() {
            if(!gameActive) return;
            let moves = getLegalMoves(boardState, 'black');
            if(moves.length > 0) {
                let caps = moves.filter(m => m.tgt);
                executeMove(caps.length > 0 ? caps[Math.floor(Math.random()*caps.length)] : moves[Math.floor(Math.random()*moves.length)]);
                if(getLegalMoves(boardState, 'white').length === 0) { gameActive=false; alert(isKingInCheck(boardState, 'white')?"Szach-Mat! Bot wygrał!":"Pat. Remis."); return; }
                playerTurn = true; document.getElementById('status').innerText = isKingInCheck(boardState,'white')?"SZACH! Broń Króla!":"Twój ruch.";
            }
        }
    </script>
</body>
</html>
